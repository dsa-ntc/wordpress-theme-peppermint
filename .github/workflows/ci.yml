name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Check repository contents
        run: node tests/repository-policy.mjs
      - name: Install development tools
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist --no-progress
          composer audit
          npm --prefix tests/browser run setup
          npm audit --prefix .local/browser --audit-level=high
      - name: Download the supported WordPress version
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://wordpress.org/wordpress-7.1.tar.gz \
            --output "$RUNNER_TEMP/wordpress.tar.gz"
          tar -xzf "$RUNNER_TEMP/wordpress.tar.gz" -C "$RUNNER_TEMP"
          echo "NTC_WORDPRESS_ROOT=$RUNNER_TEMP/wordpress" >> "$GITHUB_ENV"
      - name: Check PHP conventions and theme contracts
        run: |
          composer check
          php tests/run.php static --require-wordpress
      - name: Check browser profiles and JavaScript syntax
        run: |
          npm --prefix tests/browser run test:profiles
          node --check assets/js/theme-switcher.js
          node --check assets/js/window-titles.js
          node --check blocks/theme-switcher/index.js
      - name: Validate blocks with WordPress JavaScript
        working-directory: tests/browser
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --config=block-validation.config.mjs

  # Publish an installable zip for each pull request after the checks pass.
  # Pull requests from forks get a read-only token, so they skip this job.
  package:
    name: package
    needs: gate
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Build the theme zip
        id: build
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          version=$(sed -n 's/^Version:[[:space:]]*//p' style.css)
          zip="$RUNNER_TEMP/wordpress-theme-peppermint-${version}-pr${PR_NUMBER}-${HEAD_SHA::7}.zip"
          # WordPress installs the zip's single top folder as the theme directory.
          mkdir -p "$RUNNER_TEMP/build/wordpress-theme-peppermint"
          rsync -a --exclude-from=.distignore ./ "$RUNNER_TEMP/build/wordpress-theme-peppermint/"
          (cd "$RUNNER_TEMP/build" && zip -qr "$zip" wordpress-theme-peppermint)
          unzip -l "$zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
      - name: Replace the pull request's prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          tag="pr-${PR_NUMBER}"
          # Delete the previous build so the tag moves to the new head commit.
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" || true
          gh release create "$tag" "$ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --target "$HEAD_SHA" \
            --title "PR #${PR_NUMBER} preview: ${PR_TITLE}" \
            --notes "Preview build of #${PR_NUMBER} at ${HEAD_SHA}. It is not a stable release.

          To install it, download the zip below. In WordPress, go to Appearance > Themes > Add New Theme > Upload Theme, choose the zip, and select Replace active with uploaded."
